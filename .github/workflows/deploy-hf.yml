name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git for Push
        run: |
          git config --global user.email "deploy-bot@orchid.internal"
          git config --global user.name "Deploy Bot"

      - name: Force Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Push directly to the 'orchid-retail-backend' Space under user 'yaasaf'
          git remote add hf https://yaasaf:$HF_TOKEN@huggingface.co/spaces/yaasaf/orchid-retail-backend
          git push hf main --force
